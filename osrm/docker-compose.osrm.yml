# Self-hosted OSRM routing engine — fully isolated from the main app stack
# (separate compose project, own network, not managed by PM2/ecosystem.config.js).
#
# Bound to 127.0.0.1 only: never internet-exposed, never added to Caddy. The
# backend (a bare PM2 process on the host) reaches it over loopback at
# OSRM_BASE_URL=http://127.0.0.1:5000 (see backend/.env.example).
#
# Data (osrm/data/*.osrm*) is produced by scripts/prepare-extract.sh and is
# NOT part of this compose file — build it once before `docker compose up`.
#
# Usage:
#   cd osrm && docker compose -f docker-compose.osrm.yml up -d
#   docker compose -f docker-compose.osrm.yml ps
#   docker inspect --format '{{.State.Health.Status}}' gravity-osrm
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:26.4.0
    container_name: gravity-osrm
    # eastern-zone-filtered.osrm — see prepare-extract.sh's REGION comment for
    # why this is currently a region (Bihar/Jharkhand/Odisha/West Bengal), not
    # the full India extract, and how to widen it later.
    command: osrm-routed --algorithm mld --max-table-size 100 /data/eastern-zone-filtered.osrm
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    healthcheck:
      # osrm-routed has no literal /health route — a real route request is the
      # correct smoke test (coordinates: Patna Junction -> Gandhi Maidan, Patna
      # — must be inside whatever REGION currently covers).
      test: ["CMD-SHELL", "curl -sf 'http://localhost:5000/route/v1/driving/85.1376,25.6093;85.1414,25.6127?overview=false' | grep -q '\"Ok\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - osrm_net

networks:
  osrm_net:
    driver: bridge
