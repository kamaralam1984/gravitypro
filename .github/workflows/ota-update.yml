name: OTA Live Update (EAS)

# Publishes an Expo OTA update on every push to the deployed branch, so
# already-installed mobile apps live-update without a store release.
# Only fires when files under mobile/ change.
on:
  push:
    branches: [shivam-repo]
    paths:
      - 'mobile/**'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # Publish to BOTH channels so the update reaches every installed app:
      # the public APK is built with the "preview" profile (channel "preview"),
      # while "production" covers any store/production-channel installs. Either
      # channel having no matching builds is harmless.
      - name: Publish OTA update to channels "preview" and "production"
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed via env, never interpolated straight into `run:`. A commit
          # message is attacker-controllable text and ${{ }} is substituted
          # before bash ever sees the script, so a message containing a quote
          # breaks the command and one containing $(...) executes it — on a
          # runner holding EXPO_TOKEN, which can push JS to every installed app.
          #
          # The fallback covers manual runs: workflow_dispatch has no
          # head_commit, and eas-cli rejects an empty --message outright
          # ("--channel and --message are required ... in non-interactive mode").
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || format('Manual OTA run ({0})', github.sha) }}
        run: |
          # eas wants a short one-liner; commit bodies here run to paragraphs.
          MSG=$(printf '%s' "$UPDATE_MESSAGE" | head -1 | cut -c1-180)
          [ -n "$MSG" ] || MSG="OTA update ${GITHUB_SHA}"
          echo "Publishing: $MSG"
          npx --yes eas-cli update \
            --channel preview \
            --message "$MSG" \
            --non-interactive
          npx --yes eas-cli update \
            --channel production \
            --message "$MSG" \
            --non-interactive
